plugins {
    id 'java-library'
    id 'maven-publish'
}

base {
    archivesName = "${mod_id}-${project.name}-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
    // withJavadocJar() is deliberately absent.
    //
    // The template ships it, and for a mod it earns nothing: the jar is never published and
    // never opened, this code is full of mojmap type names nobody can javadoc usefully, and
    // it emitted 60-odd warnings on every single build -- enough that a real compiler error
    // was hard to pick out of the noise. It also failed outright once on a stale file left
    // by a killed build, which is a build-breaking task whose output nobody wants.
    //
    // "gradlew javadoc" still works when someone does want it. Armature's API reference is
    // hand-written in docs/, per plan.md R11.
}

repositories {
    mavenCentral()
    // https://docs.gradle.org/current/userguide/declaring_repositories.html#declaring_content_exclusively_found_in_one_repository
    exclusiveContent {
        forRepository {
            maven {
                name = 'Sponge'
                url = 'https://repo.spongepowered.org/repository/maven-public'
            }
        }
        filter { includeGroupAndSubgroups('org.spongepowered') }
    }

    // (A ParchmentMC repository block lived here until the 26.3 port: 26.x is unobfuscated and
    // Parchment publishes nothing for it, so there is nothing left to resolve from it.)

    // The repositories the optional parties mod needs. `maven.modrinth.com/maven` serves Open
    // Parties and Claims; FTB Teams (and with it the FTB and Architectury repositories) was
    // removed on the 26.3 port, so this is the only third-party repository left.
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
    }
}

// ---------------------------------------------------------------------------
// The one third-party parties mod, and why the declaration lives here.
//
// Armature reads Open Parties and Claims' parties behind an isModLoaded check, so
// a server without it installed loses nothing. That only works while the dependency is
// `compileOnly`: the classes are needed to compile the adapter and must never reach a jar or
// a published POM -- so you will not find it in what `publishToMavenLocal` writes,
// and a consumer compiling against armature-common needs none of it.
//
// Declared in this convention rather than in common/build.gradle because the loader projects
// *recompile common's sources*: `multiloader-loader.gradle` puts common's java source directory
// onto the loader's own compileJava, so a declaration in common alone would leave both loader
// projects unable to find these packages.
//
// (FTB Teams was the second adapter until the 26.3 port removed it; its repository entries went
// with it. See the repositories block above.)
//
// Neither coordinate is written out here on purpose. `.utils/check_integration.py` fails the build
// on a third-party *package* name in a build file, and a coordinate is one keystroke away from one
// -- the rule it enforces is that a transitive dependency is contained rather than adopted, and the
// check is what keeps that true rather than the comment above it.
// ---------------------------------------------------------------------------
dependencies {
    compileOnly "maven.modrinth:open-parties-and-claims:${opac_version}"

    // `compileOnly` reaches the test *compile* classpath and not the test *runtime* one, so a test
    // that ever constructs an adapter would compile and then fail at class loading with a
    // NoClassDefFoundError naming a mod. This is here so that the first test which does is not
    // debugging that. Nothing needs it today -- TeamProvidersTest pins the resolution chain with
    // its own providers, which is the point of the seam.
    testImplementation "maven.modrinth:open-parties-and-claims:${opac_version}"
}

// Declare capabilities on the outgoing configurations.
// Read more about capabilities here: https://docs.gradle.org/current/userguide/component_capabilities.html#sec:declaring-additional-capabilities-for-a-local-component
// Nothing here consumes these. They exist for Armature's own loader projects, which require
// the "$group:$mod_id" capability so that a loader can pull in common's classes without
// dragging in common's compileOnly dependencies.
['apiElements', 'runtimeElements', 'sourcesElements'].each { variant ->
    configurations."$variant".outgoing {
        capability("$group:${base.archivesName.get()}:$version")
        capability("$group:$mod_id-${project.name}-${minecraft_version}:$version")
        capability("$group:$mod_id:$version")
    }
    publishing.publications.configureEach {
        suppressPomMetadataWarningsFor(variant)
    }
}

sourcesJar {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${mod_name}" }
    }
}

jar {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${mod_name}" }
    }

    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Vendor'  : mod_author,
                'Specification-Version' : project.jar.archiveVersion,
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_author,
                'Built-On-Minecraft'    : minecraft_version
        ])
    }
}

processResources {
    var expandProps = [
            'version'                      : version,
            'group'                        : project.group, //Else we target the task's group.
            'minecraft_version'            : minecraft_version,
            'minecraft_version_range'      : minecraft_version_range,
            'fabric_version'               : fabric_version,
            'fabric_loader_version'        : fabric_loader_version,
            'mod_name'                     : mod_name,
            'mod_author'                   : mod_author,
            'mod_id'                       : mod_id,
            'license'                      : license,
            'description'                  : project.description,
            'neoforge_version'             : neoforge_version,
            'neoforge_loader_version_range': neoforge_loader_version_range,
            'credits'                      : credits,
            'java_version'                 : java_version
    ]

    filesMatching(['pack.mcmeta', 'fabric.mod.json', 'META-INF/mods.toml', 'META-INF/neoforge.mods.toml', '*.mixins.json']) {
        expand expandProps
    }
    inputs.properties(expandProps)
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId base.archivesName.get()
            from components.java
        }
    }
    repositories {
        // The Maven tree the release workflow uploads to maven.ellipog.dev. One directory, holding
        // every module, in the layout a repository expects -- so uploading is a copy and nothing has
        // to know what a Maven repository is. `gradlew publishToLocalRepo` is the one command.
        //
        // A *file* repository rather than an HTTP one on purpose: R2 has no PUT endpoint, so the
        // upload is a separate step (see .github/workflows/release.yml), and this stays the same
        // whether the target is R2, a bucket, or a directory somebody copies by hand.
        // The root project's build directory, not this project's. This convention is applied to
        // every subproject, so `layout.buildDirectory` would put one module in each of
        // common/build/repo, fabric/build/repo and neoforge/build/repo -- three trees, each holding
        // a third of a repository. The upload wants one.
        maven {
            name = 'localRepo'
            url = rootProject.layout.buildDirectory.dir('repo')
        }

        // A hand-run push somewhere else, when local_maven_url is set. Only declared when there is
        // a URL: a repository with a null url is a repository Gradle cannot publish to, and leaving
        // one in the list made `publish` a landmine rather than an omission.
        def remote = System.getenv('local_maven_url')
        if (remote) {
            maven {
                name = 'external'
                url = remote
            }
        }
    }
}
