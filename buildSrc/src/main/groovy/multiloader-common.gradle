plugins {
    id 'java-library'
    id 'maven-publish'
}

base {
    archivesName = "${mod_id}-${project.name}-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
    // withJavadocJar() is deliberately absent.
    //
    // The template ships it, and for a mod it earns nothing: the jar is never published and
    // never opened, this code is full of mojmap type names nobody can javadoc usefully, and
    // it emitted 60-odd warnings on every single build -- enough that a real compiler error
    // was hard to pick out of the noise. It also failed outright once on a stale file left
    // by a killed build, which is a build-breaking task whose output nobody wants.
    //
    // "gradlew javadoc" still works when someone does want it. Armature's API reference is
    // hand-written in docs/, per plan.md R11.
}

repositories {
    mavenCentral()
    // https://docs.gradle.org/current/userguide/declaring_repositories.html#declaring_content_exclusively_found_in_one_repository
    exclusiveContent {
        forRepository {
            maven {
                name = 'Sponge'
                url = 'https://repo.spongepowered.org/repository/maven-public'
            }
        }
        filter { includeGroupAndSubgroups('org.spongepowered') }
    }
    exclusiveContent {
        forRepositories(
                maven {
                    name = 'ParchmentMC'
                    url = 'https://maven.parchmentmc.org/'
                },
                maven {
                    name = "NeoForge"
                    url = 'https://maven.neoforged.net/releases'
                }
        )
        filter { includeGroup('org.parchmentmc.data') }
    }

    // -------------------------------------------------------------------------
    // The three repositories the optional teams adapters need.
    //
    // `/releases` and not `/dev`, and that is the whole of the first one: FTB publishes its
    // release builds to `maven.ftb.dev/releases`, and `maven.ftb.dev/dev` -- which is the URL
    // in most of the examples that exist -- answers 404 for the artefact. Measured, not
    // remembered.
    //
    // Architectury is here because FTB Teams depends on it, so it arrives transitively whether
    // or not this project asks for it. `plan.md` says no Architectury, and that stays true in
    // the sense that matters: nothing in the source names it, and `.utils/check_integration.py`
    // fails the build if something ever does. Depending on a library transitively is not
    // adopting it -- naming it is.
    // -------------------------------------------------------------------------
    maven {
        name = 'FTB'
        url = 'https://maven.ftb.dev/releases'
    }
    maven {
        name = 'Architectury'
        url = 'https://maven.architectury.dev'
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
    }
}

// ---------------------------------------------------------------------------
// The two third-party parties mods, and why the declarations live here.
//
// Armature reads FTB Teams' and Open Parties and Claims' parties behind an isModLoaded check, so
// a server with neither installed loses nothing. That only works while the dependency is
// `compileOnly`: the classes are needed to compile the two adapters and must never reach a jar or
// a published POM -- so you will not find either of them in what `publishToMavenLocal` writes,
// and a consumer compiling against armature-common needs neither.
//
// Declared in this convention rather than in common/build.gradle because the loader projects
// *recompile common's sources*: `multiloader-loader.gradle` puts common's java source directory
// onto the loader's own compileJava, so a declaration in common alone would leave both loader
// projects unable to find these packages.
//
// The NeoForge variant of FTB, for both loaders, deliberately. Measured: the NeoForge artefact is
// compiled against official Mojang names (`net.minecraft.network.chat.Component`) and the Fabric
// one against intermediary (`net.minecraft.class_2960`). common/ compiles against NeoForm, which
// is mojmap, so the Fabric artefact does not compile here at all. One variant, and it is the one
// both loader projects can read.
//
// Architectury and FTB Library arrive transitively from FTB Teams' own POM, which is why neither
// is named below. Architectury comes in as a plain compile dependency of that POM; FTB Library
// comes in with all of ITS transitives excluded, which is why nothing else arrives with it.
// Asserted rather than assumed, with `:common:dependencies` -- that is how "no JEI arrives
// transitively" was actually checked, and how it would be checked again after a version bump.
//
// Neither coordinate is written out here on purpose. `.utils/check_integration.py` fails the build
// on a third-party *package* name in a build file, and a coordinate is one keystroke away from one
// -- the rule it enforces is that a transitive dependency is contained rather than adopted, and the
// check is what keeps that true rather than the comment above it.
// ---------------------------------------------------------------------------
dependencies {
    compileOnly "dev.ftb.mods:ftb-teams-neoforge:${ftb_teams_version}"
    compileOnly "maven.modrinth:open-parties-and-claims:${opac_version}"

    // `compileOnly` reaches the test *compile* classpath and not the test *runtime* one, so a test
    // that ever constructs an adapter would compile and then fail at class loading with a
    // NoClassDefFoundError naming a mod. These are here so that the first test which does is not
    // debugging that. Nothing needs them today -- TeamProvidersTest pins the resolution chain with
    // its own providers, which is the point of the seam.
    testImplementation "dev.ftb.mods:ftb-teams-neoforge:${ftb_teams_version}"
    testImplementation "maven.modrinth:open-parties-and-claims:${opac_version}"
}

// Declare capabilities on the outgoing configurations.
// Read more about capabilities here: https://docs.gradle.org/current/userguide/component_capabilities.html#sec:declaring-additional-capabilities-for-a-local-component
// Nothing here consumes these. They exist for Armature's own loader projects, which require
// the "$group:$mod_id" capability so that a loader can pull in common's classes without
// dragging in common's compileOnly dependencies.
['apiElements', 'runtimeElements', 'sourcesElements'].each { variant ->
    configurations."$variant".outgoing {
        capability("$group:${base.archivesName.get()}:$version")
        capability("$group:$mod_id-${project.name}-${minecraft_version}:$version")
        capability("$group:$mod_id:$version")
    }
    publishing.publications.configureEach {
        suppressPomMetadataWarningsFor(variant)
    }
}

sourcesJar {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${mod_name}" }
    }
}

jar {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${mod_name}" }
    }

    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Vendor'  : mod_author,
                'Specification-Version' : project.jar.archiveVersion,
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_author,
                'Built-On-Minecraft'    : minecraft_version
        ])
    }
}

processResources {
    var expandProps = [
            'version'                      : version,
            'group'                        : project.group, //Else we target the task's group.
            'minecraft_version'            : minecraft_version,
            'minecraft_version_range'      : minecraft_version_range,
            'fabric_version'               : fabric_version,
            'fabric_loader_version'        : fabric_loader_version,
            'mod_name'                     : mod_name,
            'mod_author'                   : mod_author,
            'mod_id'                       : mod_id,
            'license'                      : license,
            'description'                  : project.description,
            'neoforge_version'             : neoforge_version,
            'neoforge_loader_version_range': neoforge_loader_version_range,
            'credits'                      : credits,
            'java_version'                 : java_version
    ]

    filesMatching(['pack.mcmeta', 'fabric.mod.json', 'META-INF/mods.toml', 'META-INF/neoforge.mods.toml', '*.mixins.json']) {
        expand expandProps
    }
    inputs.properties(expandProps)
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId base.archivesName.get()
            from components.java
        }
    }
    repositories {
        maven {
            url System.getenv('local_maven_url')
        }
    }
}
