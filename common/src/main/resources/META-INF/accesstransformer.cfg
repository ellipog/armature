# The item colours, for the flat-icon decision. See armature.accesswidener for the same thing on Fabric,
# and for why it is needed at all: `BakedQuad.isTinted()` is true for every `item/generated` item because
# the generator passes the layer number as the tint index, so the colour is what decides, and the colour
# lives in a private field with no accessor.
public net.minecraft.client.Minecraft itemColors
