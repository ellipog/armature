# Important Notes:
# Every field you add must be added to the buildSrc/src/main/groovy/multiloader-common.gradle expandProps map.

# Project
version=1.1.0
group=dev.ellipog
java_version=25

# Common
minecraft_version=26.3
mod_name=Armature
mod_author=ellipog
mod_id=armature
license=MIT
credits=Docs: https://ellipog.dev/docs/armature/ | Discord: https://discord.gg/nA6pm9JHd6
description=The foundation beneath the modern ecosystem.
minecraft_version_range=[26.3, 26.4)
## This is the version of minecraft that the 'common' project uses, you can find a list of all versions here
## https://projects.neoforged.net/neoforged/neoform
neo_form_version=26.3-1
# 26.x is unobfuscated with official Mojang names, so there is no Parchment for it: Loom uses
# officialMojangMappings() alone and the ModDevGradle parchment blocks are gone (see the loader
# build files). These two lines stay deleted on this branch; do not re-add them.
# parchment_minecraft= (none on 26.x)
# parchment_version= (none on 26.x)

# Fabric
fabric_version=0.162.0+26.3
fabric_loader_version=0.19.5

# Tests. JUnit 5, via the BOM so the platform and jupiter versions cannot drift apart.
#
# Deliberately the same number as tenet/gradle.properties, and deliberately a property rather than a
# literal in common/build.gradle: the two repos' tests should not be able to disagree about which JUnit
# they run. Not in the root build.gradle expandProps map, because nothing in a resource template reads
# it -- that map is for fabric.mod.json and the toml, and adding a field to it that no resource uses is
# how the map stops meaning "these are the fields the metadata needs".
junit_version=5.10.2

# The one optional parties mod, for the adapter under impl/teams/.
#
# Pinned here rather than inline in a build file, for the same reason junit_version is: an
# upgrade should be one line in one place. It is `compileOnly`, so it never appears in
# Armature's output or its published POM, and a server without it loses nothing.
#
# (FTB Teams was the second such mod until the 26.3 port removed the integration entirely.)
#
# Open Parties and Claims uses the loader-and-version form as its version string, which is why
# this one carries both.
opac_version=neoforge-26.3-0.32.8

# TR Energy (Team Reborn Energy). `compileOnly` in :fabric, for the energy adapter's classes
# and nothing else -- and Fabric only, because only Fabric needs a third-party energy library:
# NeoForge reads the energy-storage capability it ships. 4.1.x is the 1.21 line (4.2.x is
# 1.21.5+); 5.x is for 26.1+, so a 26.x migration bumps this pin with it. Pinned here rather
# than inline, for the same reason the parties pins are: an upgrade is one line in one place.
# Deliberately not in the expandProps map: nothing in a resource template reads it.
energy_version=5.0.0

# NeoForge
neoforge_version=26.3.0.76
neoforge_loader_version_range=[4,)

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
# Loom for 26.x resolves only on a 25+ JVM (its own metadata says so), and the 26.x mapping
# pipeline needs one to run -- so this branch pins its daemon here. Same arrangement as
# testModsDir* below: a path on this machine, committed, because a CI runner never reads it
# (the release workflow sets up JDK 25 itself) and main keeps running on 21.

# Local test profiles (Modrinth App). deployFabric / deployNeoForge copy
# the built jars here, deleting the previous ones first.
testModsDirFabric=C:/Users/Ellio/AppData/Roaming/ModrinthApp/profiles/Fabric 26.3/mods
testModsDirNeoForge=C:/Users/Ellio/AppData/Roaming/ModrinthApp/profiles/NeoForge 26.3/mods
