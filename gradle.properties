# Important Notes:
# Every field you add must be added to the buildSrc/src/main/groovy/multiloader-common.gradle expandProps map.

# Project
version=0.1.4
group=dev.ellipog
java_version=21

# Common
minecraft_version=1.21.1
mod_name=Armature
mod_author=ellipog
mod_id=armature
license=MIT
credits=
description=Shared library and UI toolkit for Fabric and NeoForge.
minecraft_version_range=[1.21.1, 1.21.2)
## This is the version of minecraft that the 'common' project uses, you can find a list of all versions here
## https://projects.neoforged.net/neoforged/neoform
neo_form_version=1.21.1-20240808.144430
# The version of ParchmentMC that is used, see https://parchmentmc.org/docs/getting-started#choose-a-version for new versions
parchment_minecraft=1.21
parchment_version=2024.11.10

# Fabric
fabric_version=0.109.0+1.21.1
fabric_loader_version=0.16.9

# Tests. JUnit 5, via the BOM so the platform and jupiter versions cannot drift apart.
#
# Deliberately the same number as tasked/gradle.properties, and deliberately a property rather than a
# literal in common/build.gradle: the two repos' tests should not be able to disagree about which JUnit
# they run. Not in the root build.gradle expandProps map, because nothing in a resource template reads
# it -- that map is for fabric.mod.json and the toml, and adding a field to it that no resource uses is
# how the map stops meaning "these are the fields the metadata needs".
junit_version=5.10.2

# The two optional parties mods, for the adapters under impl/teams/.
#
# Pinned here rather than inline in a build file, for the same reason junit_version is: an
# upgrade should be one line in one place. Both are `compileOnly`, so neither appears in
# Armature's output or its published POM, and a server without them loses nothing.
#
# FTB Teams on the NeoForge artefact for both loaders, and that is not a typo -- see the note in
# buildSrc/src/main/groovy/multiloader-common.gradle. The Fabric artefact is intermediary-mapped
# and common/ compiles against mojmap, so it would not compile here.
#
# 2101.1.11 is the newest 1.21.1 release of FTB Teams; 2101.* is the 1.21.1 series, as 2111.* is
# 1.21.11 and 26.* is the 26.x line.
ftb_teams_version=2101.1.11
#
# Open Parties and Claims uses the loader-and-version form as its version string, which is why
# this one carries both. 1.21.1 is the newest for this Minecraft version in the 0.31 series.
opac_version=neoforge-1.21.1-0.31.6

# NeoForge
neoforge_version=21.1.80
neoforge_loader_version_range=[4,)

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# Local test profiles (Modrinth App). deployFabric / deployNeoForge copy
# the built jars here, deleting the previous ones first.
testModsDirFabric=C:/Users/Ellio/AppData/Roaming/ModrinthApp/profiles/Tasked Fabric/mods
testModsDirNeoForge=C:/Users/Ellio/AppData/Roaming/ModrinthApp/profiles/Tasked NeoForge/mods
